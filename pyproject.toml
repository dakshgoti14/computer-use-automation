[project]
name = "computer-use-automation"
version = "0.1.0"
description = "Reusable backend integration layer for AI agents that operate applications without reliable APIs: LLM-driven discovery, structured capability artifacts, and deterministic replay."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "playwright>=1.45.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "google-genai>=0.3.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "structlog>=24.1.0",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "demo_app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line length handled by formatter/reviewer judgment, not a hard gate.
# UP042: `class Foo(str, Enum)` is used deliberately throughout for JSON
# (de)serialization ergonomics and FastAPI/OpenAPI compatibility, not an
# oversight `enum.StrEnum` should replace.
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
exclude = ["tests/", "scripts/"]
